[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "mandelbrot-benchmark"
version = "1.2.0"
description = "Benchmark Numba, Taichi, Warp, CuPy Kernel, Triton using Mandelbrot set"
readme = "README.md"
license = "MIT"
authors = [ { name = "34j" } ]
requires-python = ">=3.12,<3.14"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aquarel>=0.0.7",
  "array-api-compat>=1.11.2",
  "cm-time>=0.1.2",
  "jax>=0.4.30; sys_platform!='linux'",
  "jax[cuda12]>=0.4.30; sys_platform=='linux'",
  "matplotlib>=3.9.4",
  "numba>=0.60",
  "numpy<=2.3.4",
  "pandas>=2.3.1",
  "pydlpack>=0.2.1",
  "rich>=10",
  "seaborn>=0.13.2",
  "taichi>=1.7.4",
  "torch>=2.8",
  "tqdm>=4.70.1",
  "typer>=0.15,<1",
  "warp-lang>=1.8.1",
]
urls."Bug Tracker" = "https://github.com/34j/mandelbrot-benchmark/issues"
urls.Changelog = "https://github.com/34j/mandelbrot-benchmark/blob/main/CHANGELOG.md"
urls.documentation = "https://mandelbrot-benchmark.readthedocs.io"
urls.repository = "https://github.com/34j/mandelbrot-benchmark"
scripts.mandelbrot-benchmark = "mandelbrot_benchmark.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]>=1.1.8",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.ignore = [
  "A001",
  "ANN202",
  "C901",
  "D401",
  "DOC201",
  "DOC501",
  "E741",
  "N806",
  "PGH003",
  "PLC2701",
  "PLR1702",
  "PLR2004",
  "S404",
  "SIM108",
]
lint.extend-per-file-ignores."tests/test_dunder_main.py" = [ "S603" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
